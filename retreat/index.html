<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>2026 여름수련회 벗님 한눈에</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#0d1117; --bg2:#161b22; --card:#1c2230; --line:#2a3140;
 --tx:#e9eef7; --tx2:#9aa7bd; --tx3:#6b7789;
 --ac:#5b9dff; --ac2:#1f6feb;
 --w:#f0b429; --r:#ff6b6b; --gr:#34d399; --pu:#a78bfa;
 --safe: env(safe-area-inset-bottom,0px);
}
body.light{
 --bg:#f4f6fa; --bg2:#fff; --card:#fff; --line:#e2e7ef;
 --tx:#15202b; --tx2:#5a6779; --tx3:#8b95a5;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
 font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* ── 헤더 ── */
header{position:sticky;top:0;z-index:50;background:var(--bg);
 border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px}
.tbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tt{font-size:16px;font-weight:800;letter-spacing:-.4px;flex:1}
.tt small{display:block;font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:0}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
 background:var(--bg2);color:var(--tx2);font-size:15px;display:flex;align-items:center;
 justify-content:center;cursor:pointer;flex:none}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;padding:10px 34px 10px 34px;border-radius:11px;border:1px solid var(--line);
 background:var(--bg2);color:var(--tx);font-size:15px;outline:none}
.search input:focus{border-color:var(--ac)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--tx3);
 font-size:16px;padding:4px 6px;cursor:pointer;display:none}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:2px;margin-bottom:8px}
.seg button{flex:1;padding:7px 0;border:0;background:transparent;color:var(--tx2);
 font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ac2);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
 background:var(--bg2);color:var(--tx2);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#04101f}
.cnt{padding:8px 14px 0;font-size:12px;color:var(--tx3)}

/* ── 조 섹션 ── */
main{padding:6px 10px calc(40px + var(--safe))}
.grp{margin-bottom:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2)}
.ghead{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;user-select:none}
.gname{font-size:15px;font-weight:800;letter-spacing:-.3px}
.glead{font-size:12px;color:var(--ac);font-weight:700}
.gmeta{margin-left:auto;font-size:11.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.arw{color:var(--tx3);font-size:11px;transition:transform .18s}
.grp.cl .arw{transform:rotate(-90deg)}
.grp.cl .glist{display:none}
.glist{padding:0 8px 8px}

/* ── 카드 ── */
.card{display:flex;gap:10px;padding:9px;border-radius:12px;background:var(--card);
 border:1px solid transparent;margin-bottom:6px;cursor:pointer;align-items:flex-start}
.card:active{background:var(--line)}
.card.op{border-color:var(--ac2)}
.ph{width:52px;height:52px;border-radius:13px;flex:none;object-fit:cover;background:var(--line);display:block}
.ph.ini{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
.info{flex:1;min-width:0}
.l1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.nm{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.gi{font-size:12px;color:var(--tx2);font-weight:600}
.l2{font-size:12.5px;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;align-items:center}
.bd{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;line-height:1.5}
.b-lead{background:rgba(91,157,255,.18);color:var(--ac)}
.b-sub{background:rgba(167,139,250,.18);color:var(--pu)}
.b-part{background:rgba(240,180,41,.18);color:var(--w)}
.b-new{background:rgba(52,211,153,.18);color:var(--gr)}
.b-al{background:rgba(255,107,107,.18);color:var(--r)}
.b-vil{background:rgba(255,255,255,.07);color:var(--tx2)}
body.light .b-vil{background:rgba(0,0,0,.05)}
.days{display:flex;gap:3px;margin-left:auto;flex:none}
.dot{width:17px;height:17px;border-radius:6px;font-size:10px;font-weight:800;
 display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--tx3)}
.dot.y{background:var(--ac2);color:#fff}
.det{padding:2px 9px 10px 71px;font-size:12.5px;color:var(--tx2);display:none}
.card.op + .det{display:block}
.det div{margin-top:5px;display:flex;gap:6px}
.det b{color:var(--tx3);font-weight:600;flex:none;min-width:52px;font-size:11.5px}
.det .warn{color:var(--r)}
.pbtn{margin-top:9px;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);
 background:var(--bg2);color:var(--ac);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.pbtn:active{background:var(--line)}
.pbtn.busy{color:var(--tx3)}
#cfg{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);display:none;align-items:center;
 justify-content:center;padding:20px}
#cfg.on{display:flex}
#cfg .bx{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--line);
 border-radius:16px;padding:18px}
#cfg h2{font-size:15px;font-weight:800;margin:0 0 4px}
#cfg .sub{font-size:12px;color:var(--tx3);line-height:1.6;margin-bottom:14px}
#cfg label{display:block;font-size:11.5px;color:var(--tx2);font-weight:700;margin:10px 0 4px}
#cfg input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
 background:var(--card);color:var(--tx);font-size:14px;outline:none}
#cfg input:focus{border-color:var(--ac)}
#cfg .row{display:flex;gap:8px;margin-top:16px}
#cfg .row button{flex:1;padding:11px;border:0;border-radius:10px;font-size:14px;font-weight:700;
 font-family:inherit;cursor:pointer}
#cfg .ok{background:var(--ac2);color:#fff}
#cfg .no{background:var(--line);color:var(--tx2)}
#cfg .st{font-size:12px;margin-top:10px;min-height:16px;color:var(--tx3)}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe));transform:translateX(-50%);
 background:#111a2b;color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;
 z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;
 border:1px solid var(--line)}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--tx3);padding:40px 20px;font-size:14px}
.foot{text-align:center;color:var(--tx3);font-size:11px;padding:14px 20px 0;line-height:1.7}

#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:340px;text-align:center}
#lock h1{font-size:19px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px}
#lock p{font-size:13px;color:var(--tx3);margin:0 0 22px;line-height:1.6}
#lock input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-size:16px;outline:none;text-align:center;letter-spacing:1px}
#lock input:focus{border-color:var(--ac)}
#lock button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--ac2);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
#lock button:disabled{opacity:.5}
#lock .rem{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:13px;color:var(--tx2)}
#lock .rem input{width:auto;margin:0}
#lock .msg{margin-top:14px;font-size:13px;color:var(--r);min-height:18px}
#lock .lk{font-size:34px;margin-bottom:14px}
#shell{display:none}
body.unlocked #lock{display:none}
body.unlocked #shell{display:block}
</style>
</head>

const COLORS=['#5b9dff','#a78bfa','#34d399','#f0b429','#ff6b6b','#22d3ee','#fb923c','#f472b6'];
let view='g', filt='', q='';
const closed = new Set();

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function roleOf(p){
 const r=(p.r||'').trim();
 if(/^부조장/.test(r)) return '부조장';
 if(/^조장/.test(r)) return '조장';
 return '';
}
function isPart(p){return p.d!=='123'||/부분/.test(p.ty)||p.ps||p.sh}
function passF(p){
 if(filt==='lead') return p.L||roleOf(p)!=='';
 if(filt==='part') return isPart(p);
 if(filt==='first') return p.fv===1;
 if(filt==='al') return !!p.al;
 if(filt==='new') return p.nv===1;
 if(filt==='nog') return !p.g;
 return true;
}
function passQ(p){
 if(!q) return true;
 return (p.n+' '+p.v+' '+p.t+' '+p.f+' '+p.k+'기 '+p.g+' '+p.al+' '+p.ps).toLowerCase().includes(q);
}
function keyOf(p){
 if(view==='v') return p.v||'마을 미확인';
 if(view==='k') return p.k?p.k+'기':'기수 미상';
 if(view==='a') return '전체';
 return p.g||'조 미배정';
}
function ordOf(k){
 const m=k.match(/^(\d+)/); return m?+m[1]:9999;
}
function avatar(p){
 if(p.p) return '<img class="ph" loading="lazy" src="https://drive.google.com/thumbnail?id='+p.p+'&sz=w200" onerror="this.outerHTML=ini('+hash(p.n)+',\''+esc(p.n.slice(-2))+'\')">';
 return ini(hash(p.n), p.n.slice(-2));
}
function ini(h,t){return '<div class="ph ini" style="background:'+COLORS[h%8]+'">'+esc(t)+'</div>'}
window.ini=ini;


/* ── 사진 등록 (교적 시트 직접 저장) ── */
let CFG={url:'',token:''}, OV={};
try{CFG=JSON.parse(localStorage.getItem('rtCfg')||'{}')}catch(e){}
try{OV=JSON.parse(localStorage.getItem('rtPhotos')||'{}')}catch(e){}
CFG.url=CFG.url||''; CFG.token=CFG.token||'';
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
 clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('on'),ms||2600)}
function photoId(p){return OV[p.n]||p.p||''}
async function post(body){
 const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify(Object.assign({token:CFG.token},body))});
 return await r.json();
}
function shrink(file,max){return new Promise((res,rej)=>{
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();
  im.onload=()=>{let{width:w,height:h}=im; const s=Math.min(1,max/Math.max(w,h));
   const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   res(c.toDataURL('image/jpeg',0.85));};
  im.onerror=rej; im.src=fr.result;};
 fr.onerror=rej; fr.readAsDataURL(file);});}
let PEND=null;
window.pick=function(name,ev){
 if(ev)ev.stopPropagation();
 if(!CFG.url||!CFG.token){openCfg();toast('먼저 업로드 창구를 설정해 주세요.');return}
 PEND=name; document.getElementById('fin').value=''; document.getElementById('fin').click();
};
document.getElementById('fin').addEventListener('change',async function(){
 const f=this.files&&this.files[0]; if(!f||!PEND)return;
 const p=P.find(x=>x.n===PEND); if(!p)return;
 toast(p.n+' 사진 올리는 중…',12000);
 try{
  const img=await shrink(f,900);
  const r=await post({action:'upload',name:p.mk||p.n,gisu:p.k,gender:p.s,family:p.f,image:img});
  if(r&&r.ok){ OV[p.n]=r.fileId; try{localStorage.setItem('rtPhotos',JSON.stringify(OV))}catch(e){}
   render(); toast('✅ '+p.n+' 사진 저장 완료 ('+r.sheet+')'); }
  else toast('⚠︎ '+((r&&r.error)||'저장 실패'),5000);
 }catch(e){ toast('⚠︎ 업로드 실패 — 네트워크나 설정을 확인해 주세요.',5000); }
 PEND=null;
});
function openCfg(){document.getElementById('cUrl').value=CFG.url;
 document.getElementById('cTok').value=CFG.token;
 document.getElementById('cSt').textContent=''; document.getElementById('cfg').classList.add('on')}
document.getElementById('cog').onclick=openCfg;
document.getElementById('cNo').onclick=()=>document.getElementById('cfg').classList.remove('on');
document.getElementById('cOk').onclick=async()=>{
 const u=document.getElementById('cUrl').value.trim(), k=document.getElementById('cTok').value.trim();
 const st=document.getElementById('cSt');
 if(!u||!k){st.style.color='var(--r)';st.textContent='둘 다 입력해 주세요.';return}
 CFG={url:u,token:k}; st.style.color='var(--tx3)'; st.textContent='연결 확인 중…';
 try{ const r=await post({action:'ping'});
  if(r&&r.ok){ try{localStorage.setItem('rtCfg',JSON.stringify(CFG))}catch(e){}
   st.style.color='var(--gr)'; st.textContent='✅ 연결됐습니다.';
   setTimeout(()=>document.getElementById('cfg').classList.remove('on'),900); }
  else{ st.style.color='var(--r)'; st.textContent='⚠︎ '+((r&&r.error)||'응답이 이상합니다.'); }
 }catch(e){ st.style.color='var(--r)'; st.textContent='⚠︎ 연결 실패 — URL과 배포 권한(모든 사용자)을 확인해 주세요.'; }
};
function card(p,i){
 const badges=[];
 const rl=roleOf(p);
 if(p.L) badges.push('<span class="bd b-lead">조 담당</span>');
 if(rl==='조장') badges.push('<span class="bd b-lead">조장</span>');
 else if(rl==='부조장') badges.push('<span class="bd b-sub">부조장</span>');
 if(view!=='v'&&p.v) badges.push('<span class="bd b-vil">'+esc(p.v)+'</span>');
 if(isPart(p)) badges.push('<span class="bd b-part">부분참석</span>');
 if(p.fv===1) badges.push('<span class="bd b-new">첫 참석</span>');
 if(p.nv===1) badges.push('<span class="bd b-new">새벗</span>');
 if(p.al) badges.push('<span class="bd b-al">건강·식이</span>');
 const dots=[1,2,3].map(d=>'<div class="dot'+(p.d.includes(''+d)?' y':'')+'">'+d+'</div>').join('');
 const det=[];
 if(p.f) det.push('<div><b>가족</b><span>'+esc(p.f)+' 가족</span></div>');
 if(p.t) det.push('<div><b>사역팀</b><span>'+esc(p.t)+'</span></div>');
 if(p.g){const own=Object.keys(LEADS).filter(g=>LEADS[g]===p.n);det.push('<div><b>조</b><span>'+esc(p.g)+(own.length?' · '+own.join('·')+' 담당':'')+'</span></div>');}
 det.push('<div><b>참여일</b><span>'+(p.d?p.d.split('').map(d=>'8/'+(5+ +d)).join(', '):'미표기')+' · '+esc(p.ty||'')+'</span></div>');
 if(p.ps) det.push('<div><b>일정</b><span class="warn">'+esc(p.ps)+'</span></div>');
 if(p.sh) det.push('<div><b>셔틀</b><span class="warn">'+esc(p.sh)+'</span></div>');
 if(p.al) det.push('<div><b>건강</b><span class="warn">'+esc(p.al)+'</span></div>');
 if(!p.g) det.push('<div><b>주의</b><span class="warn">조 배정 없음</span></div>');
 det.push('<button class="pbtn" onclick="pick(\''+esc(p.n)+'\',event)">📷 '+(photoId(p)?'사진 교체':'사진 등록')+'</button>');
 return '<div class="card" onclick="tg(this)">'+avatar(p)+
  '<div class="info"><div class="l1"><span class="nm">'+esc(p.n)+'</span>'+
  '<span class="gi">'+esc(p.k)+'기 · '+esc(p.s)+'</span></div>'+
  '<div class="l2">'+esc([p.v,p.t||'사역팀 없음',p.f?p.f+' 가족':''].filter(Boolean).join(' · '))+'</div>'+
  '<div class="l3">'+badges.join('')+'<div class="days">'+dots+'</div></div></div></div>'+
  '<div class="det">'+det.join('')+'</div>';
}
window.tg=function(el){el.classList.toggle('op')}

function render(){
 const list=P.filter(p=>passF(p)&&passQ(p));
 document.getElementById('cnt').textContent=list.length+'명 표시 중 (전체 '+P.length+'명)';
 if(!list.length){document.getElementById('app').innerHTML='<div class="empty">해당하는 벗님이 없습니다.</div>';return}
 const map=new Map();
 list.forEach(p=>{const k=keyOf(p);if(!map.has(k))map.set(k,[]);map.get(k).push(p)});
 const keys=[...map.keys()].sort((a,b)=>ordOf(a)-ordOf(b)||a.localeCompare(b,'ko'));
 let h='';
 for(const k of keys){
  const arr=map.get(k);
  const rw=x=>x.L?0:(roleOf(x)==='조장'?1:(roleOf(x)==='부조장'?2:3));
  arr.sort((a,b)=>rw(a)-rw(b)||(+a.k)-(+b.k)||a.n.localeCompare(b.n,'ko'));
  const ld=(view==='g'&&LEADS[k])?{n:LEADS[k]}:null;
  const part=arr.filter(isPart).length;
  const meta=[];
  meta.push(arr.length+'명');
  if(part) meta.push('<span style="color:var(--w)">부분 '+part+'</span>');
  const cl=closed.has(k)?' cl':'';
  h+='<div class="grp'+cl+'" data-k="'+esc(k)+'"><div class="ghead" onclick="tgg(this)">'+
   '<span class="gname">'+esc(k)+'</span>'+
   (ld?'<span class="glead">담당 '+esc(ld.n)+'</span>':'')+
   '<span class="gmeta">'+meta.join(' · ')+'<span class="arw">▼</span></span></div>'+
   '<div class="glist">'+arr.map(card).join('')+'</div></div>';
 }
 document.getElementById('app').innerHTML=h;
}
window.tgg=function(el){
 const g=el.parentElement; g.classList.toggle('cl');
 const k=g.dataset.k; g.classList.contains('cl')?closed.add(k):closed.delete(k);
}
document.getElementById('q').addEventListener('input',e=>{
 q=e.target.value.trim().toLowerCase();
 document.getElementById('clr').style.display=q?'block':'none';
 render();
});
document.getElementById('clr').onclick=()=>{document.getElementById('q').value='';q='';document.getElementById('clr').style.display='none';render()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
 b.classList.add('on'); view=b.dataset.v; closed.clear(); render();
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
 c.classList.add('on'); filt=c.dataset.f; render();
});
document.getElementById('th').onclick=()=>{
 document.body.classList.toggle('light');
 try{localStorage.setItem('rtTheme',document.body.classList.contains('light')?'l':'d')}catch(e){}
};
document.getElementById('ex').onclick=()=>{
 const gs=[...document.querySelectorAll('.grp')];
 const anyOpen=gs.some(g=>!g.classList.contains('cl'));
 gs.forEach(g=>{anyOpen?(g.classList.add('cl'),closed.add(g.dataset.k)):(g.classList.remove('cl'),closed.delete(g.dataset.k))});
};
try{if(localStorage.getItem('rtTheme')==='l')document.body.classList.add('light')}catch(e){}

/* ── 암호 잠금 (AES-256-GCM · PBKDF2-SHA256) ── */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.it,hash:'SHA-256'},
   key,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},k,b64(ENC.c));
 const o=JSON.parse(new TextDecoder().decode(pt));
 P=o.people; LEADS=o.leads;
}
const $pw=document.getElementById('pw'),$go=document.getElementById('go'),$msg=document.getElementById('msg');
async function tryOpen(pw,silent){
 if(!pw){$pw.focus();return false}
 $go.disabled=true; $msg.style.color='var(--tx3)'; $msg.textContent='여는 중…';
 try{
  await unlock(pw);
  if(document.getElementById('rem').checked){try{localStorage.setItem('rtPw',pw)}catch(e){}}
  document.body.classList.add('unlocked'); render(); return true;
 }catch(e){
  try{localStorage.removeItem('rtPw')}catch(_){}
  $msg.style.color='var(--r)'; $msg.textContent=silent?'':'암호가 맞지 않습니다.';
  $pw.value=''; return false;
 }finally{$go.disabled=false; if($msg.textContent==='여는 중…')$msg.textContent='';}
}
$go.onclick=()=>tryOpen($pw.value.trim());
$pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen($pw.value.trim())});
(async()=>{
 let saved=null; try{saved=localStorage.getItem('rtPw')}catch(e){}
 if(saved){ if(await tryOpen(saved,true))return; }
 $pw.focus();
})();
</script>
