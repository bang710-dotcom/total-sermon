# 토탈 설교 앱 — GitHub Pages 배포 (GitHub Actions 소스)
# 레거시 "pages build and deployment"(dynamic) 파이프라인이 "Deployment failed, try again later"로
# 계속 실패해 공식 정적 배포 워크플로로 전환. (Settings → Pages → Source: "GitHub Actions" 선택 필요)
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 소스를 Actions(workflow)로 자동 전환 시도 — 실패 시 Settings→Pages에서 수동 전환
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
