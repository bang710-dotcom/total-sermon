# 토탈 설교 앱 — GitHub Pages 배포 (GitHub Actions 소스)
# 레거시 "pages build and deployment"(dynamic) 파이프라인이 "Deployment failed, try again later"로
# 계속 실패해 공식 정적 배포 워크플로로 전환. (Settings → Pages → Source: "GitHub Actions" 선택 필요)
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 저장소가 커서(성경·주석·폰트·예화 샤드 등 약 300MB) 배포 한 번에 수 분이 걸린다.
# 자동 커밋 워처가 짧은 간격으로 여러 번 커밋하면 그만큼 큐에 쌓여 최신 버전이 한참 뒤에 올라간다.
# → 진행 중인 배포는 취소하고 "가장 마지막 커밋"만 배포한다(중간 버전은 어차피 최신본이 덮어쓴다).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 소스를 Actions(workflow)로 자동 전환 시도 — 실패 시 Settings→Pages에서 수동 전환
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
