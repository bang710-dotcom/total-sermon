<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-title" content="Total Sermons">
<title>Total Sermons</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232d; --line:#2a2f3a;
  --text:#e8eaf0; --dim:#9aa3b2; --accent:#7c9aff; --accent2:#e0b65c;
  --ok:#5dbb7a; --warn:#e07a5c; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;touch-action:manipulation}
/* iOS standalone에서 100dvh가 짧게 잡히는 버그 → JS가 측정한 --app-h 사용 (성경앱 검증 패턴) */
#app{max-width:640px;margin:0 auto;height:100vh;height:var(--app-h,100dvh);display:flex;flex-direction:column}
/* standalone(홈화면 추가)에서는 window.innerHeight가 홈 인디케이터 안전영역만큼 짧게 잡혀
   하단에 여백이 보이던 문제 해결: 그만큼 더해 화면 맨 아래까지 채움 (성경앱과 동일) */
@media all and (display-mode:standalone){
  #app{height:min(100vh,calc(var(--app-h,100vh) + env(safe-area-inset-bottom)))}
}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(10px + env(safe-area-inset-top)) 14px 24px}
header.mobile{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
header.mobile h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
h1 span{color:var(--accent2)}
.syncState{font-size:12px;color:var(--dim)}
.sidebar{display:none}
.tabbar{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:11.5px;padding:9px 0 7px;cursor:pointer;font-family:inherit}
.tabbar button .ic{display:block;width:22px;height:22px;margin:0 auto 3px}
.tabbar button.on{color:var(--accent)}
.page{display:none}
.page.on{display:block;animation:fade .15s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
input[type=text],input[type=date],input[type=url],input[type=number],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px}
.btn{display:inline-block;background:var(--accent);color:#0c1020;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.btn.sub{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.gold{background:var(--accent2)}
.btn:active{opacity:.8}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:7px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0c1020;font-weight:700}
.chip.gold.on{background:var(--accent2);border-color:var(--accent2)}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;cursor:pointer}
.item:hover{border-color:#3a4252}
.item.sel{border-color:var(--accent)}
.item .meta{font-size:12px;color:var(--dim);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.item .title{font-weight:700;font-size:15.5px}
.item .snippet{font-size:13.5px;color:var(--dim);margin-top:5px;word-break:break-word}
.item .snippet b, .item .title b, .fulltext b{color:var(--accent2);font-weight:700}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700}
.b-sermon{background:#283250;color:#9eb4ff}.b-idea{background:#3d3322;color:#e8c87a}
.b-state{background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.empty{text-align:center;color:var(--dim);padding:38px 0;font-size:14px}
.dupbox{border:1px solid var(--warn);background:#2a1f1c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.dupbox h4{color:var(--warn);font-size:13px;margin-bottom:6px}
.dupbox .d{padding:5px 0;border-top:1px dashed #4a3a33}
.dupbox .d:first-of-type{border-top:none}
.okbox{border:1px solid var(--ok);background:#1b2a20;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;color:var(--ok)}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 20px;font-size:13.5px;opacity:0;transition:.25s;z-index:120;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.searchbox{position:sticky;top:0;background:var(--bg);padding:4px 0 10px;z-index:10}
.cnt{font-size:12.5px;color:var(--dim);margin:2px 2px 10px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;padding:4px 0}
.linkbtn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px 8px 4px 0}
.fulltext{white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--text);word-break:break-word}
.kv{font-size:13.5px;margin:7px 0;display:flex;gap:8px}
.kv .k{color:var(--dim);flex:0 0 70px}
.kv .v{white-space:pre-wrap;word-break:break-word}
#detailPane{display:none}
.detailClose{display:none}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:40px 16px;text-align:center;color:var(--dim);font-size:14.5px;transition:.15s}
.dropzone.over{border-color:var(--accent);background:#1a2030;color:var(--accent)}
.imp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.imp .row2{margin-top:8px}
.imp .warn{color:var(--warn);font-size:12.5px;margin-top:6px}
.imp .fname{font-size:12.5px;color:var(--dim);word-break:break-all}
.toolrow{display:flex;gap:9px;margin-top:14px}
.toolrow .btn{width:auto;flex:1}
/* 대지 동적 목록 (왼쪽) */
.ptRow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.ptRow .ptHead{display:flex;gap:6px;align-items:center}
.ptRow .ptNo{flex:0 0 22px;text-align:center;font-weight:700;color:var(--accent);font-size:14px}
.ptRow input{padding:8px 10px;font-size:14px}
.ptRow .ptBtn{flex:0 0 26px;height:30px;background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--dim);cursor:pointer;font-size:13px;padding:0}
.ptRow .ptBtn:hover{color:var(--text)}
.ptRow .ptIll{display:flex;gap:6px;align-items:center;margin-top:6px}
.ptRow .ptIll .exTag{flex:0 0 26px;text-align:center;color:#5b9bd5;font-weight:700;font-size:12.5px}
/* 구조화 에디터 (오른쪽) */
#editorPane{display:flex;flex-direction:column;gap:0}
.edHeader{padding:6px 4px 14px}
.edTitle{font-size:19px;font-weight:800;line-height:1.4}
.edRef{color:var(--accent2);font-size:14.5px;margin-top:3px;font-weight:700}
.edSec{margin-bottom:14px}
.edLabel{font-size:12px;color:var(--dim);margin:0 0 4px 2px}
.edPoint{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;background:var(--card)}
.edPointTitle{font-weight:800;font-size:16px;margin-bottom:8px}
.edEx{color:#5b9bd5;font-weight:800;font-size:14.5px;margin:8px 0 4px}
.edAuto{white-space:pre-wrap;font-size:14.5px;line-height:1.8;color:var(--text);padding:4px 2px}
.edAuto.msg{font-weight:800}
.edTa{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14.5px;line-height:1.8;font-family:inherit;outline:none;resize:vertical}
.edTa:focus{border-color:var(--accent)}
.edFree{min-height:60vh}
@media (min-width:900px){ .edFree{min-height:calc(100vh - 220px)} }
.foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--dim)}

/* ===================== 데스크탑 모드 ===================== */
@media (min-width: 900px){
  body{font-size:14.5px}
  .tabbar{display:none}
  header.mobile{display:none}
  #app{max-width:1500px;height:auto;display:grid;grid-template-columns:198px minmax(0,1fr);gap:20px;padding:18px 22px 30px}
  #main{overflow:visible;min-height:auto;padding:0}
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:18px;height:calc(100vh - 40px)}
  .sidebar .logo{font-size:19px;font-weight:800;padding:6px 12px 18px;letter-spacing:-.3px}
  .sidebar button.nav{display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--dim);font-size:14.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-family:inherit;width:100%}
  .sidebar button.nav:hover{color:var(--text)}
  .sidebar button.nav.on{background:var(--card);color:var(--text);font-weight:600}
  .sidebar button.nav svg{width:18px;height:18px;flex:0 0 18px}
  .sidebar .syncbtn{margin:0 8px}
  #page-search.on{display:grid;grid-template-columns:minmax(330px,460px) minmax(0,1fr);gap:20px;align-items:start}
  #searchLeft{min-width:0}
  #qResults{max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}
  #detailPane{display:block;position:sticky;top:18px;max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-height:300px}
  #page-compose.on{display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);gap:20px;align-items:start}
  #composeMeta{max-height:calc(100vh - 40px);overflow:auto;position:sticky;top:18px;padding-right:4px}
  #composeMeta label{margin-top:9px}
  #c_text{min-height:calc(100vh - 150px);font-size:15.5px;line-height:2.0;padding:20px 22px}
  #page-import{max-width:860px}
  #page-settings{max-width:680px}
  #page-inbox{max-width:860px}
}
@media (max-width: 899px){
  body{overflow:hidden} /* 이중 스크롤·고무줄 현상 방지 (앱 내부 #main만 스크롤) */
  .desktop-only{display:none !important}
  #detailPane.open{display:block;position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
  .detailClose{display:block;margin-bottom:12px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 사이드바 (데스크탑) ============ -->
  <aside class="sidebar">
    <div class="logo">Total <span style="color:var(--accent2)">Sermons</span></div>
    <button class="nav on" data-page="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>검색</button>
    <button class="nav" data-page="compose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>작성</button>
    <button class="nav" data-page="input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>빠른 입력</button>
    <button class="nav" data-page="import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>가져오기</button>
    <button class="nav" data-page="inbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>인박스</button>
    <button class="nav" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>설정</button>
    <div class="foot">
      <div class="syncState" id="syncStateD">—</div>
    </div>
  </aside>

  <div id="main">
    <header class="mobile">
      <h1>Total <span>Sermons</span></h1>
      <div class="syncState" id="syncState">—</div>
    </header>

    <!-- ============ 검색 ============ -->
    <section class="page" id="page-search">
      <div id="searchLeft">
        <div class="searchbox">
          <input type="text" id="q" placeholder="제목·본문·예화·원고 통합 검색" autocomplete="off">
          <div class="chips" style="margin-top:9px">
            <span class="chip on" data-scope="all">전체</span>
            <span class="chip" data-scope="sermons">설교</span>
            <span class="chip" data-scope="ideas">아이디어</span>
            <span class="chip gold" data-scope="illust">예화만</span>
          </div>
        </div>
        <div class="cnt" id="qCnt"></div>
        <div id="qResults"><div class="empty">검색어를 입력하시면 즉시 결과가 표시됩니다.<br>데이터는 기기에 저장되어 오프라인에서도 검색됩니다.</div></div>
      </div>
      <div id="detailPane"><div class="empty">왼쪽에서 항목을 선택하면 상세 내용이 표시됩니다.</div></div>
    </section>

    <!-- ============ 작성 (데스크탑) ============ -->
    <section class="page" id="page-compose">
      <div id="composeMeta">
        <div class="cnt" id="c_editing" style="margin-bottom:8px">새 설교</div>
        <label style="margin-top:0">원고 스타일</label>
        <div class="chips" id="c_style">
          <span class="chip gold" data-v="카드원고">카드원고</span>
          <span class="chip on" data-v="기본원고">기본원고</span>
          <span class="chip" data-v="자유원고">자유원고</span>
        </div>
        <div class="row2" style="margin-top:10px">
          <div><label>날짜</label><input type="date" id="c_date"></div>
          <div><label>예배구분</label><input type="text" id="c_service" placeholder="대학부"></div>
        </div>
        <label>제목 *</label><input type="text" id="c_title">
        <label>본문</label><input type="text" id="c_ref" placeholder="로마서 5:1-11">
        <div class="row2">
          <div><label>시리즈</label><input type="text" id="c_series"></div>
          <div><label>순번</label><input type="number" id="c_seriesNo" min="1"></div>
        </div>
        <label>상태</label>
        <select id="c_state"><option>구상</option><option>연구</option><option>작성중</option><option>완료</option><option>설교함</option></select>
        <label>핵심메시지</label><input type="text" id="c_msg">
        <label>대지 · 예화 (↑↓로 순서 변경, 번호 자동)</label>
        <div id="pointList"></div>
        <button class="linkbtn" id="addPoint">＋ 대지 추가</button>
        <div id="c_dupCheck"></div>
        <label>키워드</label><input type="text" id="c_kw" placeholder="쉼표로 구분">
        <label>비고</label><input type="text" id="c_note">
        <div class="toolrow">
          <button class="btn sub" id="c_new">새 설교</button>
          <button class="btn" id="c_save">시트에 저장</button>
        </div>
        <div class="toolrow">
          <button class="btn gold" id="c_export">DOCX 내보내기</button>
        </div>
        <div class="cnt" id="dirState" style="margin-top:10px"></div>
        <button class="linkbtn" id="pickDir">저장 폴더 지정/변경</button>
      </div>
      <div id="editorPane"></div>
    </section>

    <!-- ============ 입력 (모바일 빠른 입력) ============ -->
    <section class="page" id="page-input">
      <div class="card">
        <div class="chips" id="ideaTypes">
          <span class="chip gold on" data-v="예화">예화</span>
          <span class="chip" data-v="주제">주제</span>
          <span class="chip" data-v="통찰">통찰</span>
          <span class="chip" data-v="인용">인용</span>
          <span class="chip" data-v="질문">질문</span>
        </div>
        <label>내용 *</label>
        <textarea id="ideaContent" placeholder="떠오른 생각을 빠르게 적으세요"></textarea>
        <div id="dupCheck"></div>
        <details style="margin-top:10px"><summary>상세 정보 (선택)</summary>
          <label>관련 본문</label><input type="text" id="ideaRef" placeholder="예: 누가복음 15:11-32">
          <label>출처</label><input type="text" id="ideaSource" placeholder="책 / 기사 / 경험 등">
          <label>키워드</label><input type="text" id="ideaKw" placeholder="쉼표로 구분">
        </details>
        <div style="margin-top:14px"><button class="btn" id="saveIdea">아이디어 저장</button></div>
      </div>

      <div class="card">
        <details><summary>＋ 설교 기록 추가</summary>
          <div class="row2" style="margin-top:6px">
            <div><label>날짜</label><input type="date" id="smDate"></div>
            <div><label>예배구분</label><input type="text" id="smService" placeholder="대학부"></div>
          </div>
          <label>제목</label><input type="text" id="smTitle">
          <label>본문</label><input type="text" id="smRef" placeholder="로마서 5:1-11">

<script>
'use strict';
/* ===================== 상태 ===================== */
var LS = { settings: 'tsa.settings', data: 'tsa.data', queue: 'tsa.queue' };
var state = {
  settings: load(LS.settings) || { url: '', token: '' },
  data: { sermons: [], ideas: [], outputs: [], fetchedAt: null }, /* IndexedDB에서 비동기 로드 */
  queue: load(LS.queue) || [],
  scope: 'all', inboxFilter: '새것', ideaType: '예화',
  editing: null, lastTerms: [], importRows: []
};
function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

/* 대용량 설교 데이터는 IndexedDB에 저장 (localStorage 5MB 한도 회피) */
function idb(){ return new Promise(function(res, rej){
  var r = indexedDB.open('tsa', 1);
  r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
  r.onsuccess = function(){ res(r.result); };
  r.onerror = function(){ rej(r.error); };
});}
function idbSet(key, val){ return idb().then(function(db){ return new Promise(function(res, rej){
  var tx = db.transaction('kv', 'readwrite');
  tx.objectStore('kv').put(val, key);
  tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
});});}
function idbGet(key){ return idb().then(function(db){ return new Promise(function(res, rej){
  var tx = db.transaction('kv', 'readonly');
  var rq = tx.objectStore('kv').get(key);
  rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
});});}
function saveData(){ idbSet('data', state.data).catch(function(e){ toast('기기 저장 실패: ' + e); }); }

/* ===================== 유틸 ===================== */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2400); }
function debounce(fn, ms){ var h; return function(){ var a = arguments, c = this; clearTimeout(h); h = setTimeout(function(){ fn.apply(c, a); }, ms); }; }
function isDesktop(){ return window.matchMedia('(min-width: 900px)').matches; }
var _scripts = {};
function loadScript(src){
  if (_scripts[src]) return _scripts[src];
  _scripts[src] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = function(){ delete _scripts[src]; rej(new Error('라이브러리 로드 실패(인터넷 연결 확인): ' + src)); };
    document.head.appendChild(s);
  });
  return _scripts[src];
}

function norm(s){ return String(s || '').toLowerCase().replace(/\s+/g, ''); }
function bigrams(s){
  s = norm(s).replace(/[^가-힣a-z0-9]/g, '');
  var set = {}; var n = 0;
  for (var i = 0; i < s.length - 1; i++) { var g = s.substr(i, 2); set[g] = (set[g] || 0) + 1; n++; }
  return { set: set, n: n };
}
function similarity(a, b){
  var A = bigrams(a), B = bigrams(b);
  if (!A.n || !B.n) return 0;
  var inter = 0;
  for (var g in A.set) if (B.set[g]) inter += Math.min(A.set[g], B.set[g]);
  return 2 * inter / (A.n + B.n);
}

/* ===================== API ===================== */
function api(params){
  var s = state.settings;
  if (!s.url || !s.token) return Promise.reject(new Error('설정 탭에서 API URL과 토큰을 먼저 입력해 주세요.'));
  var qs = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(s.url + '?token=' + encodeURIComponent(s.token) + '&' + qs)
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error); return j.data; });
}
function apiPost(body){
  var s = state.settings;
  if (!s.url || !s.token) return Promise.reject(new Error('설정 탭에서 API URL과 토큰을 먼저 입력해 주세요.'));
  body.token = s.token;
  return fetch(s.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error); return j.data; });
}

function sync(){
  setSyncState('동기화 중…');
  return flushQueue().then(function(){
    return api({ action: 'list', sheet: 'all' });
  }).then(function(d){
    d.outputs = d.outputs || [];
    state.data = d; saveData();
    renderSyncState(); renderInbox(); renderStats(); runSearch();
    toast('동기화 완료 (설교 ' + d.sermons.length + ' · 아이디어 ' + d.ideas.length + ')');
  }).catch(function(e){
    renderSyncState(); toast('동기화 실패: ' + e.message);
  });
}

function flushQueue(){
  if (!state.queue.length) return Promise.resolve();
  var q = state.queue.slice();
  var chain = Promise.resolve();
  q.forEach(function(item){
    chain = chain.then(function(){
      return apiPost(item).then(function(){
        state.queue.shift(); save(LS.queue, state.queue);
      });
    });
  });
  return chain.catch(function(){ renderStats(); });
}

function submit(body, okMsg){
  return apiPost(body).then(function(id){
    toast(okMsg + (id ? ' (' + (id.ids ? id.ids.length + '건' : id.count || id) + ')' : ''));
    sync();
    return id;
  }).catch(function(e){
    if (!navigator.onLine || /fetch/i.test(e.message)) {
      state.queue.push(body); save(LS.queue, state.queue); renderStats();
      toast('오프라인 — 대기열에 저장했습니다. 다음 동기화 때 전송됩니다.');
    } else {
      toast('저장 실패: ' + e.message);
    }
  });
}

/* ===================== 검색 ===================== */
var SERMON_FIELDS = ['제목','본문','시리즈','핵심메시지','대지','예화','키워드','원고텍스트','예배구분'];
var IDEA_FIELDS = ['내용','출처','관련본문','키워드','유형'];

function hl(text, terms, clip){
  var t = String(text || '');
  if (clip && t.length > clip) {
    var pos = -1;
    for (var i = 0; i < terms.length; i++) {
      var p = t.toLowerCase().indexOf(terms[i]);
      if (p >= 0) { pos = p; break; }
    }
    var start = Math.max(0, pos - 30);
    t = (start > 0 ? '…' : '') + t.substr(start, clip) + '…';
  }
  var out = esc(t);
  terms.forEach(function(term){
    if (!term) return;
    out = out.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<b>$1</b>');
  });
  return out;
}

function findSermon(id){ return state.data.sermons.filter(function(x){ return x['ID'] === id; })[0]; }
function findIdea(id){ return state.data.ideas.filter(function(x){ return x['ID'] === id; })[0]; }

function runSearch(){
  var q = $('#q').value.trim();
  var box = $('#qResults'), cnt = $('#qCnt');
  if (!q) { cnt.textContent = ''; box.innerHTML = '<div class="empty">검색어를 입력하시면 즉시 결과가 표시됩니다.</div>'; return; }
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  state.lastTerms = terms;
  var scope = state.scope;
  var results = [];

  if (scope === 'all' || scope === 'sermons' || scope === 'illust') {
    state.data.sermons.forEach(function(s){
      var fields = scope === 'illust' ? ['예화'] : SERMON_FIELDS;
      var hayAll = fields.map(function(f){ return String(s[f] || ''); }).join(' ').toLowerCase();
      if (terms.every(function(t){ return hayAll.indexOf(t) >= 0; })) results.push({ kind: 'sermon', d: s });
    });
  }
  if (scope === 'all' || scope === 'ideas' || scope === 'illust') {
    state.data.ideas.forEach(function(d){
      if (scope === 'illust' && d['유형'] !== '예화') return;
      var hayAll = IDEA_FIELDS.map(function(f){ return String(d[f] || ''); }).join(' ').toLowerCase();
      if (terms.every(function(t){ return hayAll.indexOf(t) >= 0; })) results.push({ kind: 'idea', d: d });
    });
  }

  cnt.textContent = '결과 ' + results.length + '건';
  if (!results.length) { box.innerHTML = '<div class="empty">결과가 없습니다.</div>'; return; }
  box.innerHTML = results.slice(0, 100).map(function(r){
    if (r.kind === 'sermon') {
      var s = r.d;
      var body = '';
      ['핵심메시지','예화','원고텍스트'].forEach(function(f){
        var v = String(s[f] || '');
        if (v && terms.some(function(t){ return v.toLowerCase().indexOf(t) >= 0; }))
          body += '<div class="snippet"><b style="color:var(--dim)">' + f + '</b> ' + hl(v, terms, 90) + '</div>';
      });
      return '<div class="item" data-kind="sermon" data-id="' + esc(s['ID']) + '"><div class="meta"><span class="badge b-sermon">설교</span><span>' + esc(s['날짜']) + '</span><span>' + esc(s['예배구분']) + '</span>' +
        (s['시리즈'] ? '<span>' + esc(s['시리즈']) + (s['시리즈순번'] ? ' ' + esc(s['시리즈순번']) + '회' : '') + '</span>' : '') +
        '<span class="badge b-state">' + esc(s['상태']) + '</span></div>' +
        '<div class="title">' + hl(s['제목'], terms) + ' <span style="color:var(--dim);font-weight:400;font-size:13px">' + hl(s['본문'], terms) + '</span></div>' + body + '</div>';
    } else {
      var d = r.d;
      return '<div class="item" data-kind="idea" data-id="' + esc(d['ID']) + '"><div class="meta"><span class="badge b-idea">' + esc(d['유형']) + '</span><span>' + esc(d['등록일']) + '</span><span class="badge b-state">' + esc(d['상태']) + '</span>' +
        (d['사용설교ID'] ? '<span>→ ' + esc(d['사용설교ID']) + '</span>' : '') + '</div>' +
        '<div class="snippet" style="color:var(--text)">' + hl(d['내용'], terms, 200) + '</div>' +
        (d['관련본문'] ? '<div class="snippet">' + hl(d['관련본문'], terms) + '</div>' : '') + '</div>';
    }
  }).join('');
}

/* 결과 클릭 → 상세 */
$('#qResults').addEventListener('click', function(e){
  var item = e.target.closest('.item');
  if (!item || !item.dataset.id) return;
  $$('#qResults .item').forEach(function(x){ x.classList.remove('sel'); });
  item.classList.add('sel');
  openDetail(item.dataset.kind, item.dataset.id);
});

function openDetail(kind, id){
  var pane = $('#detailPane');
  var terms = state.lastTerms || [];
  var html = '<button class="btn sub detailClose" onclick="closeDetail()">← 목록으로</button>';
  if (kind === 'sermon') {
    var s = findSermon(id);
    if (!s) return;
    html += '<div class="meta" style="font-size:12.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">' +
      '<span class="badge b-sermon">' + esc(s['ID']) + '</span><span>' + esc(s['날짜']) + '</span><span>' + esc(s['예배구분']) + '</span><span class="badge b-state">' + esc(s['상태']) + '</span></div>' +
      '<h2 style="font-size:19px;margin:2px 0 2px">' + hl(s['제목'], terms) + '</h2>' +
      '<div style="color:var(--accent2);font-size:14px;margin-bottom:10px">' + esc(s['본문']) + '</div>';
    [['시리즈', s['시리즈'] + (s['시리즈순번'] ? ' (' + s['시리즈순번'] + '회)' : '')], ['핵심메시지', s['핵심메시지']], ['대지', s['대지']], ['예화', s['예화']], ['키워드', s['키워드']], ['비고', s['비고']]].forEach(function(kv){
      if (kv[1] && kv[1].trim && kv[1].trim()) html += '<div class="kv"><span class="k">' + kv[0] + '</span><span class="v">' + hl(kv[1], terms) + '</span></div>';
    });
    if (s['원고링크']) html += '<div class="kv"><span class="k">원고링크</span><a class="linkbtn" style="font-size:13.5px" href="' + esc(s['원고링크']) + '" target="_blank">열기 ↗</a></div>';
    html += '<div class="toolrow desktop-only">' +
      '<button class="btn sub" onclick="editSermon(\'' + esc(s['ID']) + '\')">작성 화면에서 편집</button>' +
      '<button class="btn gold" onclick="exportSermonDocx(\'' + esc(s['ID']) + '\')">DOCX 내보내기</button></div>';
    var txt = String(s['원고텍스트'] || '');
    html += '<hr style="border:none;border-top:1px solid var(--line);margin:16px 0">' +
      (txt ? '<div class="fulltext">' + hl(txt, terms) + '</div>' : '<div class="empty">저장된 원고 텍스트가 없습니다.</div>');
  } else {
    var d = findIdea(id);
    if (!d) return;
    html += '<div class="meta" style="font-size:12.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="badge b-idea">' + esc(d['유형']) + '</span><span>' + esc(d['ID']) + '</span><span>' + esc(d['등록일']) + '</span><span class="badge b-state">' + esc(d['상태']) + '</span>' +
      (d['사용설교ID'] ? '<span>→ ' + esc(d['사용설교ID']) + '</span>' : '') + '</div>' +
      '<div class="fulltext">' + hl(d['내용'], terms) + '</div>';
    [['출처', d['출처']], ['관련본문', d['관련본문']], ['키워드', d['키워드']]].forEach(function(kv){
      if (kv[1]) html += '<div class="kv"><span class="k">' + kv[0] + '</span><span class="v">' + esc(kv[1]) + '</span></div>';
    });
    html += '<div style="margin-top:10px">' +
      ['검토','사용됨','보류','새것'].filter(function(st){ return st !== d['상태']; }).map(function(st){
        return '<button class="linkbtn" onclick="setIdeaState(\'' + d['ID'] + '\',\'' + st + '\');openDetail(\'idea\',\'' + d['ID'] + '\')">' + st + '으로</button>';
      }).join('') + '</div>';
  }
  pane.innerHTML = html;
  pane.classList.add('open');
  if (isDesktop()) pane.scrollTop = 0;
}
window.openDetail = openDetail;
window.closeDetail = function(){ $('#detailPane').classList.remove('open'); };

/* ===================== 예화 중복 체크 ===================== */
function dupCandidates(text){
  var cands = [];
  state.data.sermons.forEach(function(s){
    String(s['예화'] || '').split(';').forEach(function(part){
      part = part.trim();
      if (!part) return;
      var sim = similarity(text, part);
      if (sim >= 0.22) cands.push({ sim: sim, label: s['날짜'] + ' 「' + s['제목'] + '」 설교에 사용', text: part });
    });
  });
  state.data.ideas.forEach(function(d){
    if (d['유형'] !== '예화') return;
    var sim = similarity(text, d['내용']);
    if (sim >= 0.22) cands.push({ sim: sim, label: '인박스 ' + d['ID'] + ' (' + d['상태'] + (d['사용설교ID'] ? ' · ' + d['사용설교ID'] + '에 사용' : '') + ')', text: d['내용'] });
  });
  cands.sort(function(a, b){ return b.sim - a.sim; });
  return cands;
}
function renderDup(box, text, minLen){
  if (!text || text.length < (minLen || 8)) { box.innerHTML = ''; return; }
  var cands = dupCandidates(text);
  if (!cands.length) { box.innerHTML = '<div class="okbox">✓ 비슷한 예화 기록이 없습니다.</div>'; return; }
  box.innerHTML = '<div class="dupbox"><h4>⚠ 비슷한 예화가 ' + cands.length + '건 있습니다</h4>' +
    cands.slice(0, 5).map(function(c){
      return '<div class="d"><b>' + Math.round(c.sim * 100) + '%</b> · ' + esc(c.label) + '<br><span style="color:var(--dim)">' + esc(c.text.length > 80 ? c.text.substr(0, 80) + '…' : c.text) + '</span></div>';
    }).join('') + '</div>';
}
function checkDup(){
  if (state.ideaType !== '예화') { $('#dupCheck').innerHTML = ''; return; }
  renderDup($('#dupCheck'), $('#ideaContent').value.trim());
}

window.setIdeaState = function(id, st){

/* ----- 원고 조립·저장 ----- */
function assembleText(){
  var c = state.compose;
  if (c.style === '자유원고') return c.free.trim();
  var L = [];
  if (c.intro.trim()) { L.push(c.intro.trim()); L.push(''); }
  c.points.forEach(function(p, i){
    if (!(p.text.trim() || p.body.trim() || p.ill.trim() || p.illBody.trim() || p.apply.trim())) return;
    L.push((i + 1) + '. ' + p.text.trim());
    if (p.body.trim()) L.push(p.body.trim());
    if (p.ill.trim()) L.push('ex) ' + p.ill.trim());
    if (p.illBody.trim()) L.push(p.illBody.trim());
    if (p.apply.trim()) L.push('(적용) ' + p.apply.trim());
    L.push('');
  });
  L.push(c.concIntro.trim() || '말씀을 정리합니다.');
  c.points.forEach(function(p, i){ if (p.text.trim()) L.push((i + 1) + '. ' + p.text.trim()); });
  if (c.concBody.trim()) L.push(c.concBody.trim());
  var msg = $('#c_msg').value.trim();
  if (msg) L.push(msg);
  return L.join('\n');
}
function collectCompose(){
  var data = {};
  Object.keys(C_META).forEach(function(k){ data[k] = $('#' + C_META[k]).value.trim(); });
  var pts = state.compose.points;
  data['대지'] = pts.filter(function(p){ return p.text.trim(); }).map(function(p, i){ return (i + 1) + '. ' + p.text.trim(); }).join('\n');
  data['예화'] = pts.map(function(p){ return p.ill.trim(); }).filter(Boolean).join('; ');
  data['원고텍스트'] = assembleText();
  return data;
}
function clearCompose(){
  state.editing = null;
  Object.keys(C_META).forEach(function(k){ $('#' + C_META[k]).value = ''; });
  $('#c_date').value = new Date().toISOString().slice(0, 10);
  $('#c_state').value = '구상';
  $('#c_dupCheck').innerHTML = '';
  state.compose = newCompose();
  setStyleChips(); renderPoints(); renderEditor(); updateComposeBadge();
}
window.editSermon = function(id){
  var s = findSermon(id);
  if (!s) return;
  state.editing = id;
  Object.keys(C_META).forEach(function(k){ $('#' + C_META[k]).value = s[k] || ''; });
  /* 기존 설교는 자유원고로 불러옴 (저장된 원고는 일반 텍스트) */
  var c = newCompose();
  c.style = '자유원고';
  c.free = s['원고텍스트'] || '';
  var pts = String(s['대지'] || '').split('\n').map(function(l){ return l.replace(/^\s*\d+\s*[.)]\s*/, '').trim(); }).filter(Boolean);
  var ills = String(s['예화'] || '').split(';').map(function(x){ return x.trim(); });
  c.points = pts.length ? pts.map(function(t, i){ var p = newPoint(); p.text = t; p.ill = ills[i] || ''; return p; }) : [newPoint()];
  if (!pts.length && ills.filter(Boolean).length) c.points = ills.filter(Boolean).map(function(t){ var p = newPoint(); p.ill = t; return p; });
  state.compose = c;
  setStyleChips(); renderPoints(); renderEditor(); updateComposeBadge();

};

function ensureDocxLib(){
  return loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js').then(function(){ return window.docx; });
}
/* 원고 스타일별 DOCX 서식 — 전체 폰트 함초롬바탕
   기본·자유원고: 아이패드 13" 화면용 216×290mm, 여백 10mm, 13pt, 줄간격 1.8
   카드원고: 아이패드 미니 가로화면용 210×310mm, 위·좌우 10mm 아래 12.5mm, 14pt, 줄간격 1.5 */
var DOCX_STYLES = {
  '기본원고': { font: '함초롬바탕', size: 26, line: 432, titleSize: 26, page: { w: 216, h: 290, t: 10, b: 10, l: 10, r: 10 } },
  '자유원고': { font: '함초롬바탕', size: 26, line: 432, titleSize: 26, page: { w: 216, h: 290, t: 10, b: 10, l: 10, r: 10 } },
  '카드원고': { font: '함초롬바탕', size: 28, line: 360, titleSize: 40, page: { w: 210, h: 310, t: 10, b: 12.5, l: 10, r: 10 } }
};
var EX_BLUE = '4C94D8';
function mm2twip(v){ return Math.round(v * 56.6929); }

/* paras: [{text, bold, color, size}] → Document */
function buildDocxParas(D, paras, st){
  var FONT = { ascii: st.font, eastAsia: st.font, hAnsi: st.font };
  var children = paras.map(function(p){
    return new D.Paragraph({
      spacing: { line: st.line },
      children: [new D.TextRun({ text: p.text || '', bold: !!p.bold, color: p.color, size: p.size })]
    });
  });
  var pg = st.page;
  return new D.Document({
    styles: { default: { document: { run: { font: FONT, size: st.size } } } },
    sections: [{
      properties: {
        page: {
          size: { width: mm2twip(pg.w), height: mm2twip(pg.h) },
          margin: {
            top: mm2twip(pg.t), bottom: mm2twip(pg.b),
            left: mm2twip(pg.l), right: mm2twip(pg.r),
            header: 0, footer: 0
          }
        }
      },
      children: children
    }]
  });
}

/* 메타 + 본문 텍스트(자유·기존 설교)를 문단 배열로 */
function parasFromText(meta, bodyText, style){
  var st = DOCX_STYLES[style] || DOCX_STYLES['기본원고'];
  var paras = [];
  var series = (meta['시리즈'] || '') + (meta['시리즈순번'] ? ' ' + meta['시리즈순번'] : '');
  var titleLine = style === '카드원고'
    ? (series ? series + ' - ' : '') + '「' + (meta['제목'] || '') + '」' + (meta['본문'] ? ' ' + meta['본문'] : '')
    : (series ? series + ' - ' : '') + (meta['제목'] || '');
  paras.push({ text: titleLine, bold: true, size: st.titleSize });
  if (style !== '카드원고' && meta['본문']) paras.push({ text: meta['본문'], bold: true });
  paras.push({ text: '' });
  String(bodyText || '').split('\n').forEach(function(line){
    var l = line.trim();
    var isHead = /^\d+\s*[.)]\s/.test(l);
    var isEx = /^ex\)/i.test(l);
    paras.push({ text: line, bold: isHead || isEx, color: isEx ? EX_BLUE : undefined });
  });
  return { paras: paras, st: st };
}

/* 구조화 작성 내용을 문단 배열로 (대지·ex 굵게, ex 파랑) */
function parasFromCompose(meta, c){
  var style = c.style === '자유원고' ? '기본원고' : c.style;
  if (c.style === '자유원고') return parasFromText(meta, c.free, style);
  var st = DOCX_STYLES[style];
  var base = parasFromText(meta, '', style);
  var paras = base.paras.slice(0, base.paras.length - 0); /* 제목부 + 빈 줄 */
  function push(t, b, col){ paras.push({ text: t, bold: !!b, color: col }); }
  if (c.intro.trim()) { c.intro.trim().split('\n').forEach(function(l){ push(l); }); push(''); }
  c.points.forEach(function(p, i){
    if (!(p.text.trim() || p.body.trim() || p.ill.trim() || p.illBody.trim() || p.apply.trim())) return;
    push((i + 1) + '. ' + p.text.trim(), true);
    if (p.body.trim()) p.body.trim().split('\n').forEach(function(l){ push(l); });
    if (p.ill.trim()) push('ex) ' + p.ill.trim(), true, EX_BLUE);
    if (p.illBody.trim()) p.illBody.trim().split('\n').forEach(function(l){ push(l); });
    if (p.apply.trim()) { push('(적용)', true); p.apply.trim().split('\n').forEach(function(l){ push(l); }); }
    push('');
  });
  push(c.concIntro.trim() || '말씀을 정리합니다.', true);
  c.points.forEach(function(p, i){ if (p.text.trim()) push((i + 1) + '. ' + p.text.trim(), true); });
  if (c.concBody.trim()) c.concBody.trim().split('\n').forEach(function(l){ push(l); });
  var msg = $('#c_msg') ? $('#c_msg').value.trim() : (meta['핵심메시지'] || '');
  if (msg) push(msg, true);
  return { paras: paras, st: st };
}
function docxFileName(meta){
  var ymd = (meta['날짜'] || new Date().toISOString().slice(0, 10)).replace(/-/g, '');
  var name = ymd + ' ' + (meta['예배구분'] ? meta['예배구분'] + '_' : '') + (meta['제목'] || '무제') +
    (meta['본문'] ? ' ' + meta['본문'].replace(/:/g, '_') : '');
  return name.replace(/[\\/:*?"<>|]/g, '_') + '.docx';
}
function saveDocxBlob(blob, fname, dateStr){
  if (dirHandle) {
    var year = (dateStr || '').slice(0, 4) || String(new Date().getFullYear());
    return dirHandle.queryPermission({ mode: 'readwrite' }).then(function(p){
      if (p === 'granted') return 'granted';
      return dirHandle.requestPermission({ mode: 'readwrite' });
    }).then(function(p){
      if (p !== 'granted') throw new Error('폴더 접근 권한이 거부되었습니다.');
      return dirHandle.getDirectoryHandle(year + '년', { create: true });
    }).then(function(yd){
      return yd.getFileHandle(fname, { create: true });
    }).then(function(fh){
      return fh.createWritable();
    }).then(function(w){
      return w.write(blob).then(function(){ return w.close(); });
    }).then(function(){
      toast('저장 완료: ' + dirHandle.name + '/' + (dateStr || '').slice(0, 4) + '년/' + fname);
    });
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast('다운로드 폴더에 저장: ' + fname);
  return Promise.resolve();
}
function exportDocxParas(meta, built, namePrefix){
  ensureDocxLib().then(function(D){
    return D.Packer.toBlob(buildDocxParas(D, built.paras, built.st)).then(function(blob){
      return saveDocxBlob(blob, (namePrefix || '') + docxFileName(meta), meta['날짜']);
    });
  }).catch(function(e){ toast('내보내기 실패: ' + e.message); });
}

/* ===================== DOCX 가져오기 ===================== */
var BOOKS = '창세기|출애굽기|레위기|민수기|신명기|여호수아|사사기|룻기|사무엘상|사무엘하|열왕기상|열왕기하|역대상|역대하|에스라|느헤미야|에스더|욥기|시편|잠언|전도서|아가|이사야|예레미야|예레미야애가|에스겔|다니엘|호세아|요엘|아모스|오바댜|요나|미가|나훔|하박국|스바냐|학개|스가랴|말라기|마태복음|마가복음|누가복음|요한복음|사도행전|로마서|고린도전서|고린도후서|갈라디아서|에베소서|빌립보서|골로새서|데살로니가전서|데살로니가후서|디모데전서|디모데후서|디도서|빌레몬서|히브리서|야고보서|베드로전서|베드로후서|요한일서|요한이서|요한삼서|유다서|요한계시록|창|출|레|민|신|수|삿|룻|삼상|삼하|왕상|왕하|대상|대하|스|느|에|욥|시|잠|전|아|사|렘|애|겔|단|호|욜|암|옵|욘|미|나|합|습|학|슥|말|마|막|눅|요|행|롬|고전|고후|갈|엡|빌|골|살전|살후|딤전|딤후|딛|몬|히|약|벧전|벧후|요일|요이|요삼|유|계';
var REF_TEXT_RE = new RegExp('(' + BOOKS + ')\\s*(\\d+)\\s*[:장]\\s*(\\d+)(?:\\s*[-~]\\s*(\\d+))?');
var REF_FILE_RE = new RegExp('(' + BOOKS + ')\\s*(\\d+)[\\s_:](\\d+)(?:\\s*[-~]\\s*(\\d+))?');

function fmtRef(m){ return m[1] + ' ' + m[2] + ':' + m[3] + (m[4] ? '-' + m[4] : ''); }

function parseFileDate(name, fallbackYear){
  var pats = [
    { re: /(20\d{2})[-._년\s]*(\d{1,2})[-._월\s]*(\d{1,2})일?/, two: false },
    { re: /(20\d{2})(\d{2})(\d{2})/, two: false },
    { re: /(?:^|\D)(\d{2})(\d{2})(\d{2})(?!\d)/, two: true },
    { re: /(\d{2})[-._년\s](\d{1,2})[-._월\s](\d{1,2})일?/, two: true }
  ];
  for (var i = 0; i < pats.length; i++) {
    var m = name.match(pats[i].re);
    if (!m) continue;
    var y = pats[i].two ? 2000 + parseInt(m[1], 10) : parseInt(m[1], 10);
    var mo = parseInt(m[2], 10), d = parseInt(m[3], 10);
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y >= 2000 && y <= 2100) {
      return { date: y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2), rest: (name.slice(0, m.index) + ' ' + name.slice(m.index + m[0].length)).trim() };
    }
  }
  var mm = name.match(/^(\d{2})(\d{2})[\s_\-.]/);
  if (mm && fallbackYear) {
    var mo2 = parseInt(mm[1], 10), d2 = parseInt(mm[2], 10);
    if (mo2 >= 1 && mo2 <= 12 && d2 >= 1 && d2 <= 31)
      return { date: fallbackYear + '-' + mm[1] + '-' + mm[2], rest: name.slice(mm[0].length).trim() };
  }
  return { date: '', rest: name };
}
function cleanTitle(name){
  name = name.replace(/\.(docx?|DOCX?)$/, '').replace(/(설교문?|원고|최종|수정\d*|final|v\d+)/g, '');
  return name.replace(/[\s_\-.]+/g, ' ').trim() || '(제목 미상)';
}
function docxXmlToText(xml){
  var paras = [];
  var re = /<w:p[ >][\s\S]*?<\/w:p>/g, m;
  while ((m = re.exec(xml))) {
    var ts = m[0].match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>/g) || [];
    var line = ts.map(function(t){ return t.replace(/^<w:t(?:\s[^>]*)?>/, '').replace(/<\/w:t>$/, ''); }).join('');
    line = line.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&').trim();
    if (line) paras.push(line);
  }
  return paras.join('\n');
}
function handleImportFiles(files){
  var list = Array.prototype.slice.call(files).filter(function(f){ return /\.docx$/i.test(f.name) && !/^~\$/.test(f.name); });
  if (!list.length) { toast('docx 파일이 없습니다.'); return; }
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js').then(function(){
    var chain = Promise.resolve();
    list.forEach(function(f){
      chain = chain.then(function(){
        return f.arrayBuffer().then(function(buf){ return window.JSZip.loadAsync(buf); }).then(function(zip){
          var doc = zip.file('word/document.xml');
          if (!doc) throw new Error('문서 본문을 찾을 수 없습니다');
          return doc.async('string');
        }).then(function(xml){
          var text = docxXmlToText(xml);
          var fy = new Date(f.lastModified).getFullYear();
          var pd = parseFileDate(f.name, fy);
          var tm = text.slice(0, 600).match(REF_TEXT_RE);
          var fm = f.name.match(REF_FILE_RE);
          /* 파일명 '대학부_제목' 패턴에서 예배구분 추출 */
          var service = '';
          var rest = pd.rest;
          var sm = rest.match(/^([가-힣A-Za-z0-9]{2,8})_/);
          if (sm) { service = sm[1]; rest = rest.slice(sm[0].length); }
          state.importRows.push({
            use: true, fname: f.name,
            '날짜': pd.date, '예배구분': service, '제목': cleanTitle(rest),
            '본문': tm ? fmtRef(tm) : (fm ? fmtRef(fm) : ''),
            '상태': '설교함', '원고텍스트': text
          });
        }).catch(function(e){
          state.importRows.push({ use: false, fname: f.name, error: String(e.message || e) });
        });
      });
    });
    return chain;
  }).then(renderImport).catch(function(e){ toast(e.message); });
}
function renderImport(){
  var box = $('#impList');
  $('#impActions').style.display = state.importRows.length ? 'flex' : 'none';
  box.innerHTML = state.importRows.map(function(r, i){
    if (r.error) return '<div class="imp"><div class="fname">' + esc(r.fname) + '</div><div class="warn">읽기 실패: ' + esc(r.error) + '</div></div>';
    var dup = state.data.sermons.some(function(s){
      return (s['비고'] || '').indexOf(r.fname) >= 0 || (s['날짜'] === r['날짜'] && s['제목'] === r['제목']);
    });
    return '<div class="imp">' +
      '<label style="margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)"><input type="checkbox" style="width:auto" ' + (r.use ? 'checked' : '') + ' onchange="state.importRows[' + i + '].use=this.checked"> <span class="fname">' + esc(r.fname) + ' · ' + r['원고텍스트'].length.toLocaleString() + '자</span></label>' +
      (dup ? '<div class="warn">⚠ 같은 날짜·제목 또는 같은 원본의 설교가 이미 시트에 있습니다.</div>' : '') +
      '<div class="row2"><div><label>날짜</label><input type="date" value="' + esc(r['날짜']) + '" onchange="state.importRows[' + i + '][\'날짜\']=this.value"></div>' +
      '<div><label>예배구분</label><input type="text" value="' + esc(r['예배구분']) + '" onchange="state.importRows[' + i + '][\'예배구분\']=this.value"></div></div>' +
      '<div class="row2"><div><label>제목</label><input type="text" value="' + esc(r['제목']) + '" onchange="state.importRows[' + i + '][\'제목\']=this.value"></div>' +
      '<div><label>본문</label><input type="text" value="' + esc(r['본문']) + '" onchange="state.importRows[' + i + '][\'본문\']=this.value"></div></div>' +
      '</div>';
  }).join('');
}

}, { passive: false });

/* iOS standalone에서 100dvh가 짧게 잡혀 하단에 여백이 생기는 버그 해결:
   실제 보이는 높이(window.innerHeight)를 측정해 --app-h로 주입 (성경앱 검증 패턴) */
var APP_VER = 'v9';
var _appH = 0;
function setAppHeight(){
  var h = window.innerHeight;
  if (h !== _appH) { _appH = h; document.documentElement.style.setProperty('--app-h', h + 'px'); }
}
['resize', 'orientationchange', 'pageshow', 'focus'].forEach(function(ev){ window.addEventListener(ev, setAppHeight); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setAppHeight);
  window.visualViewport.addEventListener('scroll', setAppHeight);
}
document.addEventListener('touchstart', setAppHeight, { passive: true });
/* iOS 초기 오보고 대비: 첫 3초간 250ms 간격으로 재측정 */
(function(){ var n = 0; var iv = setInterval(function(){ setAppHeight(); if (++n >= 12) clearInterval(iv); }, 250); })();

/* ===================== 시작 ===================== */
(function init(){
  setAppHeight();
  $('#setUrl').value = state.settings.url || '';
  $('#setToken').value = state.settings.token || '';
  $('#page-search').classList.add('on');
  $('#smDate').value = new Date().toISOString().slice(0, 10);
  $('#c_date').value = new Date().toISOString().slice(0, 10);
  renderSyncState(); renderInbox(); renderStats(); renderDirState(); updateComposeBadge();
  setStyleChips(); renderPoints(); renderEditor();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  idbGet('dir').then(function(h){ if (h) { dirHandle = h; renderDirState(); } }).catch(function(){});
  idbGet('data').then(function(d){
    if (d) { d.outputs = d.outputs || []; state.data = d; return; }
    var old = load(LS.data);
    if (old) { old.outputs = old.outputs || []; state.data = old; localStorage.removeItem(LS.data); return idbSet('data', old); }
  }).catch(function(){}).then(function(){
    renderSyncState(); renderInbox(); renderStats(); runSearch();
    var f = state.data.fetchedAt ? new Date(state.data.fetchedAt.replace(' ', 'T')) : null;
    if (state.settings.url && (!f || Date.now() - f.getTime() > 30 * 60 * 1000)) sync();
  });
})();
</script>
