<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-title" content="Total Sermons">
<title>Total Sermons</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232d; --line:#2a2f3a;
  --text:#e8eaf0; --dim:#9aa3b2; --accent:#7c9aff; --accent2:#e0b65c;
  --ok:#5dbb7a; --warn:#e07a5c; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;touch-action:manipulation}
#app{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
header h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
header h1 span{color:var(--accent2)}
#syncState{font-size:12px;color:var(--dim)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:11.5px;padding:9px 0 7px;cursor:pointer;font-family:inherit}
.tabbar button .ic{display:block;width:22px;height:22px;margin:0 auto 3px}
.tabbar button.on{color:var(--accent)}
.page{display:none}
.page.on{display:block;animation:fade .15s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
input[type=text],input[type=date],input[type=url],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px}
.btn{display:inline-block;background:var(--accent);color:#0c1020;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.btn.sub{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn:active{opacity:.8}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:7px 14px;font-size:13.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0c1020;font-weight:700}
.chip.gold.on{background:var(--accent2);border-color:var(--accent2)}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.item .meta{font-size:12px;color:var(--dim);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.item .title{font-weight:700;font-size:15.5px}
.item .snippet{font-size:13.5px;color:var(--dim);margin-top:5px;word-break:break-word}
.item .snippet b, .item .title b{color:var(--accent2);font-weight:700}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700}
.b-sermon{background:#283250;color:#9eb4ff}.b-idea{background:#3d3322;color:#e8c87a}
.b-state{background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.empty{text-align:center;color:var(--dim);padding:38px 0;font-size:14px}
.dupbox{border:1px solid var(--warn);background:#2a1f1c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.dupbox h4{color:var(--warn);font-size:13px;margin-bottom:6px}
.dupbox .d{padding:5px 0;border-top:1px dashed #4a3a33}
.dupbox .d:first-of-type{border-top:none}
.okbox{border:1px solid var(--ok);background:#1b2a20;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;color:var(--ok)}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 20px;font-size:13.5px;opacity:0;transition:.25s;z-index:99;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.searchbox{position:sticky;top:0;background:var(--bg);padding:4px 0 10px;z-index:10}
.cnt{font-size:12.5px;color:var(--dim);margin:2px 2px 10px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;padding:4px 0}
.linkbtn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px 8px 4px 0}
</style>

  <!-- ============ 인박스 ============ -->

    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>설정</button>

<script>
'use strict';
/* ===================== 상태 ===================== */
var LS = {
  settings: 'tsa.settings', data: 'tsa.data', queue: 'tsa.queue'
};
var state = {
  settings: load(LS.settings) || { url: '', token: '' },
  data: { sermons: [], ideas: [], fetchedAt: null }, /* IndexedDB에서 비동기 로드 */
  queue: load(LS.queue) || [],
  scope: 'all', inboxFilter: '새것', ideaType: '예화'
};
function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

/* 대용량 설교 데이터는 IndexedDB에 저장 (localStorage 5MB 한도 회피) */
function idb(){ return new Promise(function(res, rej){
  var r = indexedDB.open('tsa', 1);
  r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
  r.onsuccess = function(){ res(r.result); };
  r.onerror = function(){ rej(r.error); };
});}
function idbSet(key, val){ return idb().then(function(db){ return new Promise(function(res, rej){
  var tx = db.transaction('kv', 'readwrite');
  tx.objectStore('kv').put(val, key);
  tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
});});}
function idbGet(key){ return idb().then(function(db){ return new Promise(function(res, rej){
  var tx = db.transaction('kv', 'readonly');
  var rq = tx.objectStore('kv').get(key);
  rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
});});}
function saveData(){ idbSet('data', state.data).catch(function(e){ toast('기기 저장 실패: ' + e); }); }

/* ===================== 유틸 ===================== */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200); }
function debounce(fn, ms){ var h; return function(){ var a = arguments, c = this; clearTimeout(h); h = setTimeout(function(){ fn.apply(c, a); }, ms); }; }

/* 한글 검색 정규화 */
function norm(s){ return String(s || '').toLowerCase().replace(/\s+/g, ''); }

/* 바이그램 Dice 유사도 — 예화 중복 체크 */
function bigrams(s){
  s = norm(s).replace(/[^가-힣a-z0-9]/g, '');
  var set = {}; var n = 0;
  for (var i = 0; i < s.length - 1; i++) { var g = s.substr(i, 2); set[g] = (set[g] || 0) + 1; n++; }
  return { set: set, n: n };
}
function similarity(a, b){
  var A = bigrams(a), B = bigrams(b);
  if (!A.n || !B.n) return 0;
  var inter = 0;
  for (var g in A.set) if (B.set[g]) inter += Math.min(A.set[g], B.set[g]);
  return 2 * inter / (A.n + B.n);
}

/* ===================== API ===================== */
function api(params){
  var s = state.settings;
  if (!s.url || !s.token) return Promise.reject(new Error('설정 탭에서 API URL과 토큰을 먼저 입력해 주세요.'));
  var qs = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(s.url + '?token=' + encodeURIComponent(s.token) + '&' + qs)
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error); return j.data; });
}
function apiPost(body){
  var s = state.settings;
  if (!s.url || !s.token) return Promise.reject(new Error('설정 탭에서 API URL과 토큰을 먼저 입력해 주세요.'));
  body.token = s.token;
  return fetch(s.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error); return j.data; });
}

function sync(){
  $('#syncState').textContent = '동기화 중…';
  return flushQueue().then(function(){
    return api({ action: 'list', sheet: 'all' });
  }).then(function(d){
    state.data = d; saveData();
    renderSyncState(); renderInbox(); renderStats(); runSearch();
    toast('동기화 완료 (설교 ' + d.sermons.length + ' · 아이디어 ' + d.ideas.length + ')');
  }).catch(function(e){
    renderSyncState(); toast('동기화 실패: ' + e.message);
  });
}

/* 오프라인 큐: 저장 실패 시 보관했다가 다음 동기화 때 전송 */
function flushQueue(){
  if (!state.queue.length) return Promise.resolve();
  var q = state.queue.slice();
  var chain = Promise.resolve();
  q.forEach(function(item){
    chain = chain.then(function(){
      return apiPost(item).then(function(){
        state.queue.shift(); save(LS.queue, state.queue);
      });
    });
  });
  return chain.catch(function(){ renderStats(); });
}

function submit(body, okMsg){
  return apiPost(body).then(function(id){
    toast(okMsg + ' (' + (id.ids ? id.ids.length + '건' : id) + ')');
    sync();
    return id;
  }).catch(function(e){
    if (!navigator.onLine || /fetch/i.test(e.message)) {
      state.queue.push(body); save(LS.queue, state.queue); renderStats();
      toast('오프라인 — 대기열에 저장했습니다. 다음 동기화 때 전송됩니다.');
    } else {
      toast('저장 실패: ' + e.message);
    }
  });
}

/* ===================== 검색 ===================== */
var SERMON_FIELDS = ['제목','본문','시리즈','핵심메시지','대지','예화','키워드','원고텍스트','예배구분'];
var IDEA_FIELDS = ['내용','출처','관련본문','키워드','유형'];

function hl(text, terms, clip){
  var t = String(text || '');
  if (clip && t.length > clip) {
    var pos = -1;
    for (var i = 0; i < terms.length; i++) {
      var p = t.toLowerCase().indexOf(terms[i]);
      if (p >= 0) { pos = p; break; }
    }
    var start = Math.max(0, pos - 30);
    t = (start > 0 ? '…' : '') + t.substr(start, clip) + '…';
  }
  var out = esc(t);
  terms.forEach(function(term){
    if (!term) return;
    out = out.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<b>$1</b>');
  });
  return out;
}

function runSearch(){
  var q = $('#q').value.trim();
  var box = $('#qResults'), cnt = $('#qCnt');
  if (!q) { cnt.textContent = ''; box.innerHTML = '<div class="empty">검색어를 입력하시면 즉시 결과가 표시됩니다.</div>'; return; }
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  var scope = state.scope;
  var results = [];

  if (scope === 'all' || scope === 'sermons' || scope === 'illust') {
    state.data.sermons.forEach(function(s){
      var fields = scope === 'illust' ? ['예화'] : SERMON_FIELDS;
      var hayAll = fields.map(function(f){ return String(s[f] || ''); }).join(' ').toLowerCase();
      var hit = terms.every(function(t){ return hayAll.indexOf(t) >= 0; });
      if (hit) results.push({ kind: 'sermon', d: s });
    });
  }
  if (scope === 'all' || scope === 'ideas' || scope === 'illust') {
    state.data.ideas.forEach(function(d){
      if (scope === 'illust' && d['유형'] !== '예화') return;
      var hayAll = IDEA_FIELDS.map(function(f){ return String(d[f] || ''); }).join(' ').toLowerCase();
      var hit = terms.every(function(t){ return hayAll.indexOf(t) >= 0; });
      if (hit) results.push({ kind: 'idea', d: d });
    });
  }

  cnt.textContent = '결과 ' + results.length + '건';
  if (!results.length) { box.innerHTML = '<div class="empty">결과가 없습니다.</div>'; return; }
  box.innerHTML = results.slice(0, 100).map(function(r){
    if (r.kind === 'sermon') {
      var s = r.d;
      var body = '';
      ['핵심메시지','예화','원고텍스트'].forEach(function(f){
        var v = String(s[f] || '');
        if (v && terms.some(function(t){ return v.toLowerCase().indexOf(t) >= 0; }))
          body += '<div class="snippet"><b style="color:var(--dim)">' + f + '</b> ' + hl(v, terms, 90) + '</div>';
      });
      return '<div class="item"><div class="meta"><span class="badge b-sermon">설교</span><span>' + esc(s['날짜']) + '</span><span>' + esc(s['예배구분']) + '</span>' +
        (s['시리즈'] ? '<span>' + esc(s['시리즈']) + (s['시리즈순번'] ? ' ' + esc(s['시리즈순번']) + '회' : '') + '</span>' : '') +
        '<span class="badge b-state">' + esc(s['상태']) + '</span></div>' +
        '<div class="title">' + hl(s['제목'], terms) + ' <span style="color:var(--dim);font-weight:400;font-size:13px">' + hl(s['본문'], terms) + '</span></div>' + body +
        (s['원고링크'] ? '<div style="margin-top:6px"><a class="linkbtn" href="' + esc(s['원고링크']) + '" target="_blank">원고 열기 ↗</a></div>' : '') + '</div>';
    } else {
      var d = r.d;
      return '<div class="item"><div class="meta"><span class="badge b-idea">' + esc(d['유형']) + '</span><span>' + esc(d['등록일']) + '</span><span class="badge b-state">' + esc(d['상태']) + '</span>' +
        (d['사용설교ID'] ? '<span>→ ' + esc(d['사용설교ID']) + '</span>' : '') + '</div>' +
        '<div class="snippet" style="color:var(--text)">' + hl(d['내용'], terms, 200) + '</div>' +
        (d['관련본문'] ? '<div class="snippet">' + hl(d['관련본문'], terms) + '</div>' : '') + '</div>';
    }
  }).join('');
}

/* ===================== 예화 중복 체크 ===================== */
function checkDup(){
  var type = state.ideaType;
  var text = $('#ideaContent').value.trim();
  var box = $('#dupCheck');
  if (type !== '예화' || text.length < 8) { box.innerHTML = ''; return; }
  var cands = [];
  state.data.sermons.forEach(function(s){
    String(s['예화'] || '').split(';').forEach(function(part){
      part = part.trim();
      if (!part) return;
      var sim = similarity(text, part);
      if (sim >= 0.22) cands.push({ sim: sim, label: s['날짜'] + ' 「' + s['제목'] + '」 설교에 사용', text: part });
    });
  });
  state.data.ideas.forEach(function(d){
    if (d['유형'] !== '예화') return;
    var sim = similarity(text, d['내용']);
    if (sim >= 0.22) cands.push({ sim: sim, label: '인박스 ' + d['ID'] + ' (' + d['상태'] + (d['사용설교ID'] ? ' · ' + d['사용설교ID'] + '에 사용' : '') + ')', text: d['내용'] });
  });
  if (!cands.length) { box.innerHTML = '<div class="okbox">✓ 비슷한 예화 기록이 없습니다.</div>'; return; }
  cands.sort(function(a, b){ return b.sim - a.sim; });
  box.innerHTML = '<div class="dupbox"><h4>⚠ 비슷한 예화가 ' + cands.length + '건 있습니다</h4>' +
    cands.slice(0, 5).map(function(c){
      return '<div class="d"><b>' + Math.round(c.sim * 100) + '%</b> · ' + esc(c.label) + '<br><span style="color:var(--dim)">' + esc(c.text.length > 80 ? c.text.substr(0, 80) + '…' : c.text) + '</span></div>';
    }).join('') + '</div>';
}

/* ===================== 인박스 ===================== */
function renderInbox(){
  var f = state.inboxFilter;
  var list = state.data.ideas.filter(function(d){ return !f || d['상태'] === f; });
  list.sort(function(a, b){ return b['ID'] < a['ID'] ? -1 : 1; });
  var box = $('#inboxList');
  if (!list.length) { box.innerHTML = '<div class="empty">해당 항목이 없습니다.</div>'; return; }
  box.innerHTML = list.map(function(d){
    return '<div class="item"><div class="meta"><span class="badge b-idea">' + esc(d['유형']) + '</span><span>' + esc(d['등록일']) + '</span><span class="badge b-state">' + esc(d['상태']) + '</span>' +
      (d['사용설교ID'] ? '<span>→ ' + esc(d['사용설교ID']) + '</span>' : '') + '</div>' +
      '<div class="snippet" style="color:var(--text)">' + esc(d['내용']) + '</div>' +
      (d['관련본문'] ? '<div class="snippet">' + esc(d['관련본문']) + '</div>' : '') +
      '<div style="margin-top:7px">' +
      ['검토','사용됨','보류','새것'].filter(function(s){ return s !== d['상태']; }).map(function(s){
        return '<button class="linkbtn" onclick="setIdeaState(\'' + d['ID'] + '\',\'' + s + '\')">' + s + '으로</button>';
      }).join('') + '</div></div>';
  }).join('');
}
window.setIdeaState = function(id, st){
  var d = state.data.ideas.filter(function(x){ return x['ID'] === id; })[0];
  if (!d) return;
  var payload = { action: 'update', sheet: 'ideas', data: { ID: id, '상태': st } };
  if (st === '사용됨') {
    var sid = prompt('사용된 설교 ID를 입력하세요 (예: S0012, 모르면 비워두세요)', d['사용설교ID'] || '');
    if (sid != null && sid.trim()) payload.data['사용설교ID'] = sid.trim();
  }
  d['상태'] = st; saveData(); renderInbox();
  submit(payload, '상태 변경');
};

/* ===================== 저장 동작 ===================== */
$('#saveIdea').addEventListener('click', function(){
  var content = $('#ideaContent').value.trim();
  if (!content) { toast('내용을 입력해 주세요.'); return; }
  var body = { action: 'add', sheet: 'ideas', data: {
    '유형': state.ideaType, '내용': content, '출처': $('#ideaSource').value.trim(),
    '관련본문': $('#ideaRef').value.trim(), '키워드': $('#ideaKw').value.trim(), '상태': '새것'
  }};
  $('#ideaContent').value = ''; $('#ideaSource').value = ''; $('#ideaRef').value = ''; $('#ideaKw').value = '';
  $('#dupCheck').innerHTML = '';
  submit(body, '아이디어 저장 완료');
});

$('#saveSermon').addEventListener('click', function(){
  var title = $('#smTitle').value.trim();
  if (!title) { toast('제목을 입력해 주세요.'); return; }
  var body = { action: 'add', sheet: 'sermons', data: {
    '날짜': $('#smDate').value, '예배구분': $('#smService').value.trim(), '제목': title,
    '본문': $('#smRef').value.trim(), '시리즈': $('#smSeries').value.trim(),
    '상태': $('#smState').value, '핵심메시지': $('#smMsg').value.trim(), '예화': $('#smIllust').value.trim()
  }};
  ['smTitle','smRef','smSeries','smMsg','smIllust'].forEach(function(id){ $('#' + id).value = ''; });
  submit(body, '설교 저장 완료');
});

$('#saveSettings').addEventListener('click', function(){
  state.settings = { url: $('#setUrl').value.trim(), token: $('#setToken').value.trim() };
  save(LS.settings, state.settings);
  toast('설정 저장됨');
  api({ action: 'ping' }).then(function(){ toast('연결 성공! 동기화를 시작합니다.'); return sync(); })
    .catch(function(e){ toast('연결 확인 실패: ' + e.message); });
});
$('#syncBtn').addEventListener('click', sync);

/* ===================== 탭/칩 ===================== */
$$('.tabbar button').forEach(function(b){
  b.addEventListener('click', function(){
    $$('.tabbar button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    $$('.page').forEach(function(p){ p.classList.remove('on'); });
    $('#page-' + b.dataset.page).classList.add('on');
    if (b.dataset.page === 'search') $('#q').focus();
    if (b.dataset.page === 'input') $('#ideaContent').focus();
  });
});
$$('#page-search .chip').forEach(function(c){
  c.addEventListener('click', function(){
    $$('#page-search .chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); state.scope = c.dataset.scope; runSearch();
  });
});
$$('#ideaTypes .chip').forEach(function(c){
  c.addEventListener('click', function(){
    $$('#ideaTypes .chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); state.ideaType = c.dataset.v; checkDup();
  });
});
$$('#inboxFilter .chip').forEach(function(c){
  c.addEventListener('click', function(){
    $$('#inboxFilter .chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); state.inboxFilter = c.dataset.v; renderInbox();
  });
});

$('#q').addEventListener('input', debounce(runSearch, 120));
$('#ideaContent').addEventListener('input', debounce(checkDup, 350));

/* iOS 핀치 줌·더블탭 줌 방지 */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
var lastTouch = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now - lastTouch < 320 && !/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName)) e.preventDefault();
  lastTouch = now;
}, { passive: false });

/* ===================== 렌더 보조 ===================== */
function renderSyncState(){
  var f = state.data.fetchedAt;
  $('#syncState').textContent = f ? '동기화: ' + f : '미동기화';
}
function renderStats(){
  $('#dataStat').textContent = '기기 저장 데이터 — 설교 ' + state.data.sermons.length + '건 · 아이디어 ' + state.data.ideas.length + '건';
  $('#queueStat').textContent = state.queue.length ? '전송 대기 중인 입력: ' + state.queue.length + '건' : '';
}

/* ===================== 시작 ===================== */
(function init(){
  $('#setUrl').value = state.settings.url || '';
  $('#setToken').value = state.settings.token || '';
  $('#page-search').classList.add('on');
  $('#smDate').value = new Date().toISOString().slice(0, 10);
  renderSyncState(); renderInbox(); renderStats();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  idbGet('data').then(function(d){
    if (d) { state.data = d; return; }
    /* 구버전(localStorage) 데이터가 있으면 IndexedDB로 이전 */
    var old = load(LS.data);
    if (old) { state.data = old; localStorage.removeItem(LS.data); return idbSet('data', old); }
  }).catch(function(){}).then(function(){
    renderSyncState(); renderInbox(); renderStats(); runSearch();
    /* 30분 이상 지났으면 자동 동기화 */
    var f = state.data.fetchedAt ? new Date(state.data.fetchedAt.replace(' ', 'T')) : null;
    if (state.settings.url && (!f || Date.now() - f.getTime() > 30 * 60 * 1000)) sync();
  });
})();
</script>
</body>
</html>
